# Ankra application descriptor.
# Ankra reads this file on every analysis run. The options below are this
# application's deploy-time parameter contract - they drive the deploy form and
# are validated on deploy. Edit them here and re-run setup to change it.
apiVersion: ankra.io/v1
kind: Application
metadata:
  name: "ankra-docs"
  version: "0.1.0"
  app_version: "0.1.0"
  icon: "https://avatars.githubusercontent.com/u/126952620?v=4"
  sources:
    - "https://github.com/ankraio/ankra-docs"
  maintainers:
    - name: "ankraio"
      url: "https://github.com/ankraio"
options:
  - name: "image_tag"
    type: "string"
    required: false
    description: "Container image tag to deploy. Use an immutable tag such as sha-<commit> or a semver release, never 'latest'."
  - name: "replicas"
    type: "number"
    default: "1"
    required: false
    description: "Number of pod replicas."
  - name: "target_port"
    type: "number"
    default: "3000"
    required: false
    description: "Container port the application listens on."
  - name: "cpu_request"
    type: "string"
    default: "100m"
    required: false
    description: "CPU request per pod."
  - name: "cpu_limit"
    type: "string"
    default: "500m"
    required: false
    description: "CPU limit per pod."
  - name: "memory_request"
    type: "string"
    default: "128Mi"
    required: false
    description: "Memory request per pod."
  - name: "memory_limit"
    type: "string"
    default: "512Mi"
    required: false
    description: "Memory limit per pod."
  - name: "ingress_enabled"
    type: "boolean"
    default: "false"
    required: false
    description: "Expose the service through an Ingress."
  - name: "ingress_host"
    type: "string"
    default: ""
    required: false
    description: "Ingress hostname (required when ingress is enabled)."
  - name: "ingress_class"
    type: "string"
    default: ""
    required: false
    description: "IngressClass name (e.g. traefik). Leave empty to use the cluster's default IngressClass."
  - name: "ingress_extra_hosts"
    type: "string"
    default: ""
    required: false
    description: "Comma-separated additional hostnames the Ingress also serves (e.g. a customer's own domain). Each becomes its own rule and TLS host beside ingress_host; at most 5."
  - name: "redirect_hosts"
    type: "string"
    default: ""
    required: false
    description: "Comma-separated hostnames that permanently redirect to ingress_host, keeping the path and query (e.g. an old or misspelled domain). Each gets its own DNS record and certificate; at most 5. Needs the traefik ingress class."
  - name: "env_from_secrets"
    type: "string"
    default: ""
    required: false
    description: "Comma-separated names of Secrets in the application's namespace whose keys become environment variables (envFrom)."
  - name: "ingress_tls_issuer"
    type: "string"
    default: "letsencrypt-prod"
    required: false
    description: "cert-manager ClusterIssuer that mints the Ingress certificate. Leave empty to serve plain HTTP."
