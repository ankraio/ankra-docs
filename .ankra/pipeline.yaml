# Ankra pipeline.
# Ankra runs this pipeline in your own cluster on every push, pull request and
# schedule it declares. Stages run as hardened Jobs sharing one workspace;
# ${{ … }} expressions are resolved per run. Edit it here - Git is the source
# of truth, and the definition on the default branch governs authority.
apiVersion: ankra.io/v1
kind: Pipeline
metadata:
  name: "ankra-docs"
on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
    fork_policy: "read_only"
  manual: {}
concurrency:
  group: "${{ ankra.repository.provider }}:${{ ankra.repository.owner }}/${{ ankra.repository.name }}-${{ ankra.ref }}"
  cancel_in_progress: true
workspace:
  mode: "per_step"
  handoff: "changes"
  size: "10Gi"
defaults:
  timeout: "30m"
  network: "egress-https"
permissions:
  contents: "read"
stages:
  - name: "checkout"
    kind: "checkout"
  # Soak of per-step workspaces (ankra-ojcig.16): produce changes the tree,
  # consume proves it restored the checkout plus produce's changes layer.
  - name: "produce"
    kind: "run"
    image: "alpine:3.20.3"
    needs:
      - "checkout"
    network: "none"
    run: |
      set -eu
      mkdir -p soak-out
      echo "written by produce" > soak-out/marker.txt
      echo "appended by produce" >> README.md
      rm -f STYLEGUIDE.md
      ln -s ../README.md soak-out/readme-link
  - name: "consume"
    kind: "run"
    image: "alpine:3.20.3"
    needs:
      - "produce"
    network: "none"
    run: |
      set -eu
      test -f package.json
      grep -qx "written by produce" soak-out/marker.txt
      tail -n 1 README.md | grep -qx "appended by produce"
      test ! -e STYLEGUIDE.md
      test "$(readlink soak-out/readme-link)" = "../README.md"
      echo "per-step handoff verified"
  - name: "build"
    kind: "build"
    needs:
      - "checkout"
    network: "egress-https"
    build:
      provenance: true
      sbom: true
  - name: "scan"
    kind: "scan"
    with:
      image_gate: "app"
      semgrep_config: "p/default p/docker p/github-actions p/javascript"
    needs:
      - "build"
    network: "egress-https"
    scan:
      scanners:
        - "semgrep"
        - "checkov"
        - "trivy"
      fail_on:
        checkov: "none"
        semgrep: "error"
        trivy: "app"
  - name: "gate"
    kind: "gate"
    needs:
      - "scan"
    gate:
      require_stages:
        - "scan"
  - name: "publish"
    kind: "publish"
    with:
      image: "registry.ankra.cloud/org-3b7dccca-0788-4470-9910-19478ae345ae/ankra-docs"
    needs:
      - "gate"
    publish:
      promote_from: "pull_request"
    when:
      events:
        - "push"
