# Ankra pipeline.
# Ankra runs this pipeline in your own cluster on every push, pull request and
# schedule it declares. Stages run as hardened Jobs sharing one workspace;
# ${{ … }} expressions are resolved per run. Edit it here - Git is the source
# of truth, and the definition on the default branch governs authority.
apiVersion: ankra.io/v1
kind: Pipeline
metadata:
  name: "ankra-docs"
on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
    fork_policy: "read_only"
  # Nightly on master's tip: build and scan the image as the next pull request
  # would, so an advisory published while nobody merges reaches the image gate,
  # and master's failure card in Slack, the next morning instead of as one red
  # pull request after another. Publish is push-only, so this never publishes.
  # The platform fires a schedule only from a schedules row: after changing the
  # cron here, change it there too (`ankra pipeline schedules list --application
  # ankra-docs`).
  schedule:
    - cron: "17 3 * * *"
      branch: "master"
      stages:
        - "checkout"
        - "build"
        - "scan"
        - "gate"
  manual: {}
concurrency:
  # A pull request run's ankra.ref is its base branch, so keying on the ref alone
  # put every pull request and master's push runs in one group, where each new
  # run cancelled the one in progress. Pull requests are keyed by their number;
  # runs no commit started (the nightly, a manual run) share a group of their
  # own, so they never cancel a push run's publish.
  group: "${{ ankra.repository.provider }}:${{ ankra.repository.owner }}/${{ ankra.repository.name }}-${{ event.kind == 'pull_request' ? format('pr-{0}', event.pull_request.number) : event.kind == 'push' ? ankra.ref : 'nightly' }}"
  cancel_in_progress: true
workspace:
  size: "10Gi"
  access: "rwo"
defaults:
  timeout: "30m"
  network: "egress-https"
permissions:
  contents: "read"
stages:
  - name: "checkout"
    kind: "checkout"
  - name: "build"
    kind: "build"
    needs:
      - "checkout"
    timeout: "45m"
    resources:
      cpu: "4"
      memory: "6Gi"
    network: "egress-https"
    build:
      provenance: true
      sbom: true
  - name: "scan"
    kind: "scan"
    with:
      image_gate: "app"
      semgrep_config: "p/default p/docker p/github-actions p/javascript"
    needs:
      - "build"
    network: "egress-https"
    scan:
      scanners:
        - "semgrep"
        - "checkov"
        - "trivy"
      fail_on:
        checkov: "none"
        semgrep: "error"
        trivy: "app"
  - name: "gate"
    kind: "gate"
    needs:
      - "scan"
    gate:
      require_stages:
        - "scan"
  - name: "publish"
    kind: "publish"
    with:
      image: "registry.ankra.cloud/org-3b7dccca-0788-4470-9910-19478ae345ae/ankra-docs"
    needs:
      - "gate"
    publish:
      promote_from: "pull_request"
    when:
      events:
        - "push"
