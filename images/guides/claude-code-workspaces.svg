    .ankra { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.5; }
    .pod { fill: #ffffff; stroke: #14b8a6; stroke-width: 2; }
    .decide { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .chipA { fill: #ffffff; stroke: #5eead4; stroke-width: 1; }
    .chipC { fill: #ffffff; stroke: #fcd34d; stroke-width: 1; }
    .row { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .term { fill: #0f172a; }
    .termText { fill: #e2e8f0; }
    .prompt { fill: #a5b4fc; }
    .tag { fill: #0f172a; }
    .tagText { fill: #5eead4; }
    .meter { fill: #e2e8f0; }
    .fillA { fill: #4f46e5; } .fillB { fill: #0d9488; }
    .slot { fill: none; stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .badgeA { fill: #4f46e5; } .badgeB { fill: #0d9488; } .badgeC { fill: #d97706; }
    .flow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 5 5; }
    .a { stroke: #4f46e5; } .aText { fill: #4f46e5; } .mkA { fill: #4f46e5; }
    .b { stroke: #0d9488; } .bText { fill: #0d9488; } .mkB { fill: #0d9488; }
    .c { stroke: #d97706; } .cText { fill: #d97706; } .mkC { fill: #d97706; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .lane, .section, .boxSub { fill: #94a3b8; }
      .legend, .chipText { fill: #cbd5e1; }
      .badgeText { fill: #0f172a; }
      .bg { fill: none; }
      .shadow { fill: #000000; opacity: 0.25; }
      .zoneL { fill: #0b1220; stroke: #1e293b; }
      .zoneW { fill: #031716; stroke: #134e4a; }
      .you { fill: #1e1b4b; stroke: #4338ca; }
      .ankra { fill: #042f2e; stroke: #0f766e; }
      .pod { fill: #0f172a; stroke: #2dd4bf; }
      .decide { fill: #3b2f0b; stroke: #b45309; }
      .chip, .row { fill: #1e293b; stroke: #475569; }
      .chipA { fill: #1e293b; stroke: #0f766e; }
      .chipC { fill: #1e293b; stroke: #b45309; }
      .term { fill: #020617; }
      .tag { fill: #134e4a; }
      .tagText { fill: #99f6e4; }
      .meter { fill: #1e293b; }
      .fillA { fill: #818cf8; } .fillB { fill: #2dd4bf; }
      .slot { stroke: #fbbf24; }
      .badgeA { fill: #818cf8; } .badgeB { fill: #2dd4bf; } .badgeC { fill: #fbbf24; }
      .a { stroke: #818cf8; } .aText, .mkA { fill: #818cf8; }
      .b { stroke: #2dd4bf; } .bText, .mkB { fill: #2dd4bf; }
      .c { stroke: #fbbf24; } .cText, .mkC { fill: #fbbf24; }
    }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkB" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkC" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="612"/>

  <text class="lane" x="40" y="44">SAME COMMANDS IN CLAUDE CODE · THE HEAVY ONES RUN IN THE WORKSPACE</text>
  <g id="legend">
    <rect class="you" x="860" y="32" width="14" height="14" rx="4"/>
    <text class="legend" x="881" y="44">Claude Code</text>
    <rect class="ankra" x="980" y="32" width="14" height="14" rx="4"/>
    <text class="legend" x="1001" y="44">Ankra</text>
    <rect class="decide" x="1068" y="32" width="14" height="14" rx="4"/>
    <text class="legend" x="1089" y="44">Stays on the laptop</text>
  </g>

  <!-- Zones -->
  <rect class="zoneL" x="24" y="68" width="680" height="520" rx="20"/>
  <text class="lane" x="44" y="98">YOUR LAPTOP</text>
  <rect class="zoneW" x="824" y="68" width="432" height="520" rx="20"/>
  <text class="lane" x="846" y="98">ANKRA WORKSPACE · YOUR CI POOL</text>

  <!-- Claude Code sessions -->
  <g id="session-a">
    <rect class="shadow" x="44" y="120" width="200" height="88" rx="14"/>
    <rect class="you" x="44" y="116" width="200" height="88" rx="14"/>
    <circle class="badgeA" cx="66" cy="139" r="10"/>
    <text class="badgeText" x="66" y="143" text-anchor="middle">A</text>
    <text class="boxText" x="84" y="144">Claude Code</text>
    <text class="boxSub" x="60" y="166">worktree feature-a</text>
    <rect class="term" x="58" y="176" width="172" height="20" rx="6"/>
    <text class="mono prompt" x="68" y="190">$</text>
    <text class="mono termText" x="80" y="190">go test ./...</text>
  </g>
  <g id="session-b">
    <rect class="shadow" x="44" y="224" width="200" height="88" rx="14"/>
    <rect class="you" x="44" y="220" width="200" height="88" rx="14"/>
    <circle class="badgeA" cx="66" cy="243" r="10"/>
    <text class="badgeText" x="66" y="247" text-anchor="middle">B</text>
    <text class="boxText" x="84" y="248">Claude Code</text>
    <text class="boxSub" x="60" y="270">worktree feature-b</text>
    <rect class="term" x="58" y="280" width="172" height="20" rx="6"/>
    <text class="mono prompt" x="68" y="294">$</text>
    <text class="mono termText" x="80" y="294">pnpm typecheck</text>
  </g>
  <g id="session-c">
    <rect class="shadow" x="44" y="328" width="200" height="88" rx="14"/>
    <rect class="you" x="44" y="324" width="200" height="88" rx="14"/>
    <circle class="badgeA" cx="66" cy="347" r="10"/>
    <text class="badgeText" x="66" y="351" text-anchor="middle">C</text>
    <text class="boxText" x="84" y="352">Claude Code</text>
    <text class="boxSub" x="60" y="374">worktree feature-c</text>
    <rect class="term" x="58" y="384" width="172" height="20" rx="6"/>
    <text class="mono prompt" x="68" y="398">$</text>
    <text class="mono termText" x="80" y="398">golangci-lint run</text>
  </g>
  <text class="boxSub" x="44" y="446">One git worktree per session.</text>
  <text class="boxSub" x="44" y="466">Same command, same output,</text>
  <text class="boxSub" x="44" y="486">same exit code.</text>

  <!-- Sessions into the shims -->
  <path class="flow a" d="M244 160 C262 160 262 232 277 232" marker-end="url(#m-a)"/>
  <path class="flow a" d="M244 264 L277 264" marker-end="url(#m-a)"/>
  <path class="flow a" d="M244 368 C262 368 262 296 277 296" marker-end="url(#m-a)"/>

  <!-- Dev shims -->
  <g id="shims">
    <rect class="shadow" x="280" y="132" width="144" height="268" rx="14"/>
    <rect class="ankra" x="280" y="128" width="144" height="268" rx="14"/>
    <text class="boxText" x="298" y="158">dev shims</text>
    <text class="boxSub" x="298" y="178">first on PATH</text>
    <rect class="chip" x="296" y="194" width="112" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="352" y="210" text-anchor="middle">go</text>
    <rect class="chip" x="296" y="226" width="112" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="352" y="242" text-anchor="middle">gofmt</text>
    <rect class="chip" x="296" y="258" width="112" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="352" y="274" text-anchor="middle">golangci-lint</text>
    <rect class="chip" x="296" y="290" width="112" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="352" y="306" text-anchor="middle">pnpm</text>
    <rect class="chip" x="296" y="322" width="112" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="352" y="338" text-anchor="middle">npm</text>
    <rect class="chip" x="296" y="354" width="112" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="352" y="370" text-anchor="middle">npx</text>
  </g>

  <!-- Shims to ankra exec and to the local tool -->
  <path class="flow b" d="M424 214 L485 214" marker-end="url(#m-b)"/>
  <text class="edge bText" x="454" y="205" text-anchor="middle">routed</text>
  <path class="flow c" d="M424 340 C456 340 456 470 485 470" marker-end="url(#m-c)"/>
  <text class="edge cText" x="432" y="331">local</text>

  <!-- ankra exec -->
  <g id="ankra-exec">
    <rect class="shadow" x="488" y="120" width="196" height="196" rx="14"/>
    <rect class="ankra" x="488" y="116" width="196" height="196" rx="14"/>
    <text class="boxText mono" x="506" y="146" style="font-size: 14px; font-weight: 700;">ankra exec</text>
    <text class="boxSub" x="506" y="168">every routed command</text>
    <circle class="badgeB" cx="510" cy="192" r="3"/>
    <text class="boxSub" x="520" y="196">snapshots the worktree</text>
    <circle class="badgeB" cx="510" cy="214" r="3"/>
    <text class="boxSub" x="520" y="218">uploads only new objects</text>
    <circle class="badgeB" cx="510" cy="236" r="3"/>
    <text class="boxSub" x="520" y="240">streams output back live</text>
    <rect class="chipA" x="506" y="262" width="76" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="544" y="278" text-anchor="middle">--apply</text>
    <rect class="chipA" x="590" y="262" width="76" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="628" y="278" text-anchor="middle">--fetch</text>
  </g>

  <!-- Fallback -->
  <path class="flow c dash" d="M560 314 L560 389" marker-end="url(#m-c)"/>
  <text class="mono cText" x="572" y="348" style="font-weight: 600;">exit 196</text>
  <text class="boxSub" x="572" y="366">runs here instead</text>

  <!-- Local tool -->
  <g id="local">
    <rect class="shadow" x="488" y="396" width="196" height="172" rx="14"/>
    <rect class="decide" x="488" y="392" width="196" height="172" rx="14"/>
    <text class="boxText" x="506" y="422">Runs locally</text>
    <text class="boxSub" x="506" y="442">the real tool, as before</text>
    <rect class="chipC" x="504" y="458" width="80" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="544" y="474" text-anchor="middle">go run</text>
    <rect class="chipC" x="590" y="458" width="80" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="630" y="474" text-anchor="middle">go install</text>
    <rect class="chipC" x="504" y="490" width="80" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="544" y="506" text-anchor="middle">pnpm add</text>
    <rect class="chipC" x="590" y="490" width="80" height="24" rx="12"/>
    <text class="mono chipMono chipText" x="630" y="506" text-anchor="middle">--headed</text>
    <rect class="chipC" x="504" y="522" width="166" height="24" rx="12"/>
    <text class="chipText" x="587" y="538" text-anchor="middle">dev servers, watch mode</text>
  </g>

  <!-- Laptop to workspace and back -->
  <path class="flow b" d="M684 172 L845 172" marker-end="url(#m-b)"/>
  <text class="edge bText" x="764" y="162" text-anchor="middle">snapshot</text>
  <path class="flow b" d="M846 238 L687 238" marker-end="url(#m-b)"/>
  <text class="edge bText" x="764" y="258" text-anchor="middle">live output</text>
  <text class="edge bText" x="764" y="274" text-anchor="middle">exit code</text>

  <!-- Workspace pod -->
  <g id="pod">
    <rect class="shadow" x="846" y="128" width="388" height="392" rx="16"/>
    <rect class="pod" x="846" y="124" width="388" height="392" rx="16"/>
    <text class="boxText" x="866" y="154">Workspace pod</text>
    <rect class="tag" x="1110" y="139" width="106" height="22" rx="11"/>
    <text class="mono tagText" x="1163" y="154" text-anchor="middle">warm, reused</text>
    <text class="boxSub" x="866" y="176">one per repository and workspace kind</text>

    <text class="section" x="866" y="206">ONE CHECKOUT PER WORKTREE</text>
    <rect class="row" x="866" y="216" width="348" height="34" rx="10"/>
    <circle class="badgeA" cx="886" cy="233" r="10"/>
    <text class="badgeText" x="886" y="237" text-anchor="middle">A</text>
    <text class="mono chipText" x="906" y="237">go test ./...</text>
    <text class="edge bText" x="1200" y="237" text-anchor="end">running</text>
    <rect class="row" x="866" y="256" width="348" height="34" rx="10"/>
    <circle class="badgeA" cx="886" cy="273" r="10"/>
    <text class="badgeText" x="886" y="277" text-anchor="middle">B</text>
    <text class="mono chipText" x="906" y="277">pnpm typecheck</text>
    <text class="edge bText" x="1200" y="277" text-anchor="end">running</text>
    <rect class="row" x="866" y="296" width="348" height="34" rx="10"/>
    <circle class="badgeA" cx="886" cy="313" r="10"/>
    <text class="badgeText" x="886" y="317" text-anchor="middle">C</text>
    <text class="mono chipText" x="906" y="317">golangci-lint run</text>
    <text class="edge cText" x="1200" y="317" text-anchor="end">waits for a run slot</text>

    <text class="section" x="866" y="362">RESOURCES.MEMORY, SHARED BY EVERY COMMAND</text>
    <rect class="meter" x="866" y="372" width="348" height="12" rx="6"/>
    <rect class="fillB" x="866" y="372" width="132" height="12" rx="6"/>
    <rect class="fillB" x="1002" y="372" width="112" height="12" rx="6"/>
    <rect class="slot" x="1118" y="372" width="96" height="12" rx="6"/>

    <text class="section" x="866" y="418">SHARED BY EVERY CHECKOUT</text>
    <rect class="chipA" x="866" y="428" width="112" height="24" rx="12"/>
    <text class="chipText" x="922" y="444" text-anchor="middle">Go build cache</text>
    <rect class="chipA" x="986" y="428" width="86" height="24" rx="12"/>
    <text class="chipText" x="1029" y="444" text-anchor="middle">lint cache</text>
    <rect class="chipA" x="1080" y="428" width="92" height="24" rx="12"/>
    <text class="chipText" x="1126" y="444" text-anchor="middle">pnpm store</text>
    <rect class="chipA" x="866" y="460" width="100" height="24" rx="12"/>
    <text class="chipText" x="916" y="476" text-anchor="middle">pinned tools</text>
    <rect class="chipA" x="974" y="460" width="132" height="24" rx="12"/>
    <text class="chipText" x="1040" y="476" text-anchor="middle">postgres service</text>
  </g>
  <text class="boxSub" x="846" y="552">Idle for 24 hours: torn down, the next command</text>
  <text class="boxSub" x="846" y="570">brings a fresh one.</text>
</svg>
