<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 612" width="1280" height="612" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code sessions run the same commands, and the heavy ones run in the Ankra Workspace</title>
  <desc id="desc">On the laptop, three Claude Code sessions each work in their own git worktree and run go test, pnpm typecheck and golangci-lint as usual. The ankra dev shims, first on PATH, route the heavy commands to ankra exec and leave everything else, such as go run, installs, dev servers and headed browsers, to the real tool on the laptop. ankra exec snapshots the worktree, uploads only the objects the workspace lacks, and streams the output and the exit code back live; --apply brings changed files back and --fetch copies results back. When a command cannot run remotely it exits 196 and the shim runs it locally instead. In the Ankra Workspace on the organisation's CI pool, one warm pod per repository and kind keeps one checkout per worktree, shares its memory between every running command so heavy commands queue for a run slot, and shares the Go build cache, lint cache, pnpm store, pinned tools and service containers such as Postgres between all checkouts. A workspace idle for 24 hours is torn down and the next command brings a fresh one.</desc>
