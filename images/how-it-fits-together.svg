<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 336" width="820" height="336" role="img" aria-labelledby="title desc">
  <title id="title">How Ankra fits together</title>
  <desc id="desc">An organisation owns clusters. Each cluster runs the Ankra agent and deploys Stacks. A Stack is made of add-ons, which are Helm charts, and manifests, which are Kubernetes YAML. A Git repository is optional and syncs with the Stack in both directions.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .cardTitle { font-size: 18px; font-weight: 600; }
    .sub { font-size: 14.5px; fill: #475569; }
    .bg { fill: #ffffff; }
    .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .accent { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.75; }
    .optional { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .tile { fill: #e0e7ff; }
    .accentTile { fill: #4f46e5; }
    .icon { fill: none; stroke: #4f46e5; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .accentIcon { fill: none; stroke: #ffffff; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .pill { fill: #ffffff; stroke: #c7d2fe; stroke-width: 1.25; }
    .pillText { font-size: 12.5px; font-weight: 600; fill: #3730a3; }
    .live { fill: #22c55e; }
    .flow { fill: none; stroke: #4f46e5; stroke-width: 2.25; }
    .sync { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 5; }
    .mkA { fill: #4f46e5; }
    .mkS { fill: #64748b; }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkS" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="820" height="336"/>

  <g id="organisation">
    <rect class="card" x="20" y="76" width="168" height="136" rx="14"/>
    <rect class="tile" x="36" y="92" width="34" height="34" rx="9"/>
    <g class="icon" transform="translate(43 99)">
      <circle cx="7.5" cy="6.5" r="3"/>
      <path d="M2 16.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
      <circle cx="14" cy="7.5" r="2.4"/>
      <path d="M14.5 11.6c2.2.3 3.8 2 3.8 4.4"/>
    </g>
    <text class="cardTitle" x="36" y="152">Organisation</text>
    <text class="sub" x="36" y="176">Members, roles,</text>
    <text class="sub" x="36" y="196">credentials, billing</text>
  </g>

  <g id="cluster">
    <rect class="card" x="220" y="76" width="172" height="136" rx="14"/>
    <rect class="tile" x="236" y="92" width="34" height="34" rx="9"/>
    <g class="icon" transform="translate(243 99)">
      <path d="M10 1.8 17.2 6v8L10 18.2 2.8 14V6z"/>
      <circle cx="10" cy="10" r="2.4"/>
    </g>
    <text class="cardTitle" x="236" y="152">Cluster</text>
    <text class="sub" x="236" y="176">Any Kubernetes</text>
    <rect class="pill" x="236" y="184" width="108" height="20" rx="10"/>
    <circle class="live" cx="248" cy="194" r="3.5"/>
    <text class="pillText" x="257" y="198.5">Ankra agent</text>
  </g>

  <g id="stack">
    <rect class="accent" x="424" y="76" width="152" height="136" rx="14"/>
    <rect class="accentTile" x="440" y="92" width="34" height="34" rx="9"/>
    <g class="accentIcon" transform="translate(447 99)">
      <path d="M10 2.5 18 6.5 10 10.5 2 6.5z"/>
      <path d="M2 10.2 10 14.2 18 10.2"/>
      <path d="M2 13.9 10 17.9 18 13.9"/>
    </g>
    <text class="cardTitle" x="440" y="152">Stack</text>
    <text class="sub" x="440" y="176">What a cluster</text>
    <text class="sub" x="440" y="196">should run</text>
  </g>

  <g id="addons">
    <rect class="card" x="624" y="20" width="176" height="114" rx="14"/>
    <rect class="tile" x="640" y="36" width="34" height="34" rx="9"/>
    <g class="icon" transform="translate(647 43)">
      <path d="M10 2 17.5 5.8v8.4L10 18 2.5 14.2V5.8z"/>
      <path d="M2.5 5.8 10 9.6 17.5 5.8"/>
      <path d="M10 9.6V18"/>
    </g>
    <text class="cardTitle" x="640" y="96">Add-ons</text>
    <text class="sub" x="640" y="120">Helm charts</text>
  </g>

  <g id="manifests">
    <rect class="card" x="624" y="154" width="176" height="114" rx="14"/>
    <rect class="tile" x="640" y="170" width="34" height="34" rx="9"/>
    <g class="icon" transform="translate(647 177)">
      <path d="M5 2h7l4 4v12H5z"/>
      <path d="M12 2v4h4"/>
      <path d="M7.5 10.5h6M7.5 13.8h6"/>
    </g>
    <text class="cardTitle" x="640" y="230">Manifests</text>
    <text class="sub" x="640" y="254">Kubernetes YAML</text>
  </g>

  <g id="git">
    <rect class="optional" x="180" y="258" width="240" height="58" rx="14"/>
    <rect class="tile" x="194" y="270" width="34" height="34" rx="9"/>
    <g class="icon" transform="translate(201 277)">
      <circle cx="5.5" cy="4.5" r="2.2"/>
      <circle cx="5.5" cy="15.5" r="2.2"/>
      <circle cx="14.5" cy="7" r="2.2"/>
      <path d="M5.5 6.7v6.6"/>
      <path d="M14.5 9.2c0 3-4 3.3-8.2 4.6"/>
    </g>
    <text class="cardTitle" x="240" y="284" style="font-size:16px">Git repository</text>
    <text class="sub" x="240" y="305" style="font-size:13.5px">Optional, syncs both ways</text>
  </g>

  <g>
    <path class="flow" d="M190 144 H217" marker-end="url(#m-a)"/>
    <path class="flow" d="M394 144 H421" marker-end="url(#m-a)"/>
    <path class="flow" d="M578 144 C600 144 598 77 621 77" marker-end="url(#m-a)"/>
    <path class="flow" d="M578 144 C600 144 598 211 621 211" marker-end="url(#m-a)"/>
    <path class="sync" d="M423 287 H486 Q500 287 500 273 V215" marker-start="url(#m-s)" marker-end="url(#m-s)"/>
  </g>
</svg>
