<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 236" width="820" height="236" role="img" aria-labelledby="title desc">
  <title id="title">Speed up CI: run what a change touches, publish what was tested</title>
  <desc id="desc">A pull request runs only the stages its files touch. The image is built once, scanned and gated by digest. The merge train tests the pull request as it will merge. Publish re-tags the tested image instead of building it again. If Ankra cannot see every changed file, nothing is skipped.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .num { font-size: 15px; font-weight: 700; fill: #4f46e5; }
    .cardTitle { font-size: 20px; font-weight: 600; }
    .sub { font-size: 16px; fill: #475569; }
    .bg { fill: #ffffff; }
    .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .last { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
    .band { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.25; }
    .bandText { font-size: 17px; font-weight: 600; fill: #3730a3; }
    .flow { fill: none; stroke: #4f46e5; stroke-width: 2.5; }
    .mkA { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .sub { fill: #cbd5e1; }
      .num { fill: #a5b4fc; }
      .bg { fill: none; }
      .card { fill: #1e293b; stroke: #475569; }
      .last { fill: #052e16; stroke: #16a34a; }
      .band { fill: #1e1b4b; stroke: #4338ca; }
      .bandText { fill: #c7d2fe; }
      .flow { stroke: #a5b4fc; }
      .mkA { fill: #a5b4fc; }
    }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="820" height="236"/>

  <g id="step1">
    <rect class="card" x="20" y="20" width="171" height="124" rx="14"/>
    <text class="num" x="38" y="48">1</text>
    <text class="cardTitle" x="38" y="76">Pull request</text>
    <text class="sub" x="38" y="104">Only the stages</text>
    <text class="sub" x="38" y="126">it touches run</text>
  </g>

  <g id="step2">
    <rect class="card" x="223" y="20" width="171" height="124" rx="14"/>
    <text class="num" x="241" y="48">2</text>
    <text class="cardTitle" x="241" y="76">Built once</text>
    <text class="sub" x="241" y="104">Scanned and</text>
    <text class="sub" x="241" y="126">gated by digest</text>
  </g>

  <g id="step3">
    <rect class="card" x="426" y="20" width="171" height="124" rx="14"/>
    <text class="num" x="444" y="48">3</text>
    <text class="cardTitle" x="444" y="76">Merge train</text>
    <text class="sub" x="444" y="104">Tested as it</text>
    <text class="sub" x="444" y="126">will merge</text>
  </g>

  <g id="step4">
    <rect class="last" x="629" y="20" width="171" height="124" rx="14"/>
    <text class="num" x="647" y="48">4</text>
    <text class="cardTitle" x="647" y="76">Publish</text>
    <text class="sub" x="647" y="104">Re-tags the</text>
    <text class="sub" x="647" y="126">tested image</text>
  </g>

  <g>
    <path class="flow" d="M193 82 H220" marker-end="url(#m-a)"/>
    <path class="flow" d="M396 82 H423" marker-end="url(#m-a)"/>
    <path class="flow" d="M599 82 H626" marker-end="url(#m-a)"/>
  </g>

  <rect class="band" x="20" y="166" width="780" height="50" rx="12"/>
  <text class="bandText" x="410" y="197" text-anchor="middle">If Ankra cannot see every changed file, nothing is skipped</text>
</svg>
