<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 376" width="1280" height="376" role="img" aria-labelledby="title desc">
  <title id="title">Speed up CI: run what a change touches, publish what was tested</title>
  <desc id="desc">A pull request's changed files are read from the provider. Only the stages those files touch run, and the tests of untouched components are skipped. The image is built, scanned and gated by digest. The merge train tests the pull request on top of the latest main and merges it. On the merge, publish re-tags the image that was already tested, because the tree is the same. When Ankra cannot see the full list of changed files, nothing is skipped.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; fill: #64748b; }
    .cardTitle { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12px; fill: #64748b; }
    .chipText { font-size: 12px; font-weight: 600; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .bg { fill: #ffffff; }
    .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .last { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .badge { fill: #4f46e5; }
    .band { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.25; }
    .bandText { font-size: 14px; font-weight: 600; fill: #3730a3; }
    .flow { fill: none; stroke: #4f46e5; stroke-width: 2; }
    .mkA { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .lane, .sub { fill: #94a3b8; }
      .num { fill: #0f172a; }
      .bg { fill: none; }
      .card { fill: #1e293b; stroke: #475569; }
      .last { fill: #052e16; stroke: #15803d; }
      .chip { fill: #0f172a; stroke: #475569; }
      .badge { fill: #818cf8; }
      .band { fill: #1e1b4b; stroke: #3730a3; }
      .bandText { fill: #c7d2fe; }
      .flow { stroke: #818cf8; }
      .mkA { fill: #818cf8; }
    }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="376"/>

  <text class="lane" x="40" y="44">A PULL REQUEST RUNS WHAT IT TOUCHES · MAIN PUBLISHES THE IMAGE THAT WAS TESTED</text>

  <g id="step1">
    <rect class="card" x="40" y="76" width="208" height="176" rx="14"/>
    <circle class="badge" cx="70" cy="110" r="14"/>
    <text class="num" x="70" y="115" text-anchor="middle">1</text>
    <text class="cardTitle" x="94" y="116">Pull request</text>
    <text class="sub" x="60" y="152">Ankra reads the changed</text>
    <text class="sub" x="60" y="170">files from your provider.</text>
    <rect class="chip" x="60" y="196" width="168" height="34" rx="9"/>
    <text class="chipText" x="144" y="218" text-anchor="middle">changed files</text>
  </g>

  <g id="step2">
    <rect class="card" x="288" y="76" width="208" height="176" rx="14"/>
    <circle class="badge" cx="318" cy="110" r="14"/>
    <text class="num" x="318" y="115" text-anchor="middle">2</text>
    <text class="cardTitle" x="342" y="116">Affected stages</text>
    <text class="sub" x="308" y="152">Tests a change did not</text>
    <text class="sub" x="308" y="170">touch are skipped.</text>
    <rect class="chip" x="308" y="196" width="168" height="34" rx="9"/>
    <text class="chipText" x="392" y="218" text-anchor="middle">paths · when · if</text>
  </g>

  <g id="step3">
    <rect class="card" x="536" y="76" width="208" height="176" rx="14"/>
    <circle class="badge" cx="566" cy="110" r="14"/>
    <text class="num" x="566" y="115" text-anchor="middle">3</text>
    <text class="cardTitle" x="590" y="116">Build and gate</text>
    <text class="sub" x="556" y="152">One image, scanned and</text>
    <text class="sub" x="556" y="170">judged by its digest.</text>
    <rect class="chip" x="556" y="196" width="168" height="34" rx="9"/>
    <text class="chipText" x="640" y="218" text-anchor="middle">gate-approved digest</text>
  </g>

  <g id="step4">
    <rect class="card" x="784" y="76" width="208" height="176" rx="14"/>
    <circle class="badge" cx="814" cy="110" r="14"/>
    <text class="num" x="814" y="115" text-anchor="middle">4</text>
    <text class="cardTitle" x="838" y="116">Merge train</text>
    <text class="sub" x="804" y="152">Tested on the latest main,</text>
    <text class="sub" x="804" y="170">then merged.</text>
    <rect class="chip" x="804" y="196" width="168" height="34" rx="9"/>
    <text class="chipText" x="888" y="218" text-anchor="middle">squashed onto main</text>
  </g>

  <g id="step5">
    <rect class="last" x="1032" y="76" width="208" height="176" rx="14"/>
    <circle class="badge" cx="1062" cy="110" r="14"/>
    <text class="num" x="1062" y="115" text-anchor="middle">5</text>
    <text class="cardTitle" x="1086" y="116">Publish</text>
    <text class="sub" x="1052" y="152">Same tree, so the tested</text>
    <text class="sub" x="1052" y="170">image is re-tagged.</text>
    <rect class="chip" x="1052" y="196" width="168" height="34" rx="9"/>
    <text class="chipText" x="1136" y="218" text-anchor="middle">promote_from</text>
  </g>

  <g>
    <path class="flow" d="M248 164 H286" marker-end="url(#m-a)"/>
    <path class="flow" d="M496 164 H534" marker-end="url(#m-a)"/>
    <path class="flow" d="M744 164 H782" marker-end="url(#m-a)"/>
    <path class="flow" d="M992 164 H1030" marker-end="url(#m-a)"/>
  </g>

  <rect class="band" x="40" y="284" width="1200" height="64" rx="12"/>
  <text class="bandText" x="640" y="310" text-anchor="middle">When Ankra cannot see every changed file, nothing is skipped</text>
  <text class="sub" x="640" y="332" text-anchor="middle">no file list · more than 300 files · a new branch · a force push · an edit to .ankra/pipeline.yaml</text>
</svg>
