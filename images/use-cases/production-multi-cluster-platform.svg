<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Hub and spokes: the infrastructure cluster receives, the application clusters send</title>
  <desc id="desc">Two application clusters (production and development) send metrics by remote_write and logs by _bulk into the infrastructure cluster's ingest endpoints, and restore points into a backup vault per environment. Inside the infrastructure cluster, Prometheus with Alertmanager and OpenSearch with Dashboards receive the data; Grafana reads Prometheus and Tempo; Harbor and OneUptime sit beside them; a staff single sign-on realm on Kratos, Hydra and oauth2-proxy signs people into Grafana, OpenSearch Dashboards, Harbor and OneUptime. Alertmanager and Ankra notifications both deliver to one on-call channel.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; fill: #64748b; }
    .cardTitle { font-size: 16px; font-weight: 600; }
    .cardSub { font-size: 12px; fill: #64748b; }
    .chipText { font-size: 13px; font-weight: 500; }
    .boxText { font-size: 14px; font-weight: 600; }
    .boxSub { font-size: 12px; fill: #64748b; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #3730a3; }
    .vaultText { fill: #92400e; }
    .edge { font-size: 11px; font-weight: 500; }
    .bg { fill: #ffffff; }
    .card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .hub { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .strip { fill: #e0e7ff; }
    .vault { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; }
    .chip, .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .sso { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.25; }
    .metrics { stroke: #4f46e5; } .metricsText, .mkMetrics { fill: #4f46e5; }
    .logs { stroke: #0d9488; } .logsText, .mkLogs { fill: #0d9488; }
    .backups { stroke: #d97706; } .backupsText, .mkBackups { fill: #d97706; }
    .alerts { stroke: #e11d48; } .alertsText, .mkAlerts { fill: #e11d48; }
    .signin { stroke: #94a3b8; stroke-dasharray: 4 4; } .mkSignin { fill: #94a3b8; }
    .flow { fill: none; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .lane { fill: #94a3b8; }
      .cardSub, .boxSub { fill: #94a3b8; }
      .mono { fill: #c7d2fe; }
      .vaultText { fill: #fde68a; }
      .bg { fill: none; }
      .card { fill: #1e293b; stroke: #334155; }
      .hub { fill: #1e1b4b; stroke: #3730a3; }
      .strip { fill: #312e81; }
      .vault { fill: #3b2f0b; stroke: #a16207; }
      .chip, .box { fill: #0f172a; stroke: #475569; }
      .sso { fill: #1e293b; stroke: #475569; }
      .metrics { stroke: #818cf8; } .metricsText, .mkMetrics { fill: #818cf8; }
      .logs { stroke: #2dd4bf; } .logsText, .mkLogs { fill: #2dd4bf; }
      .backups { stroke: #fbbf24; } .backupsText, .mkBackups { fill: #fbbf24; }
      .alerts { stroke: #fb7185; } .alertsText, .mkAlerts { fill: #fb7185; }
    }
  </style>
  <defs>
    <marker id="m-metrics" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkMetrics" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-logs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkLogs" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-backups" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkBackups" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-alerts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkAlerts" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-signin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkSignin" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>

  <text class="lane" x="70" y="44">APPLICATION CLUSTERS · SPOKES</text>

  <g id="production">
    <rect class="card" x="70" y="60" width="500" height="150" rx="14"/>
    <text class="cardTitle" x="90" y="92">production cluster</text>
    <text class="cardSub" x="90" y="110">3 control planes · what customers use</text>
    <rect class="chip" x="90" y="130" width="160" height="44" rx="10"/>
    <text class="chipText" x="170" y="157" text-anchor="middle">Apps + CloudNativePG</text>
    <rect class="chip" x="270" y="130" width="120" height="44" rx="10"/>
    <text class="chipText" x="330" y="157" text-anchor="middle">Fluent Bit</text>
    <rect class="chip" x="410" y="130" width="140" height="44" rx="10"/>
    <text class="chipText" x="480" y="157" text-anchor="middle">Prometheus agent</text>
  </g>

  <g id="development">
    <rect class="card" x="710" y="60" width="500" height="150" rx="14"/>
    <text class="cardTitle" x="730" y="92">development cluster</text>
    <text class="cardSub" x="730" y="110">1 control plane · rebuilt from Git</text>
    <rect class="chip" x="730" y="130" width="140" height="44" rx="10"/>
    <text class="chipText" x="800" y="157" text-anchor="middle">Prometheus agent</text>
    <rect class="chip" x="890" y="130" width="120" height="44" rx="10"/>
    <text class="chipText" x="950" y="157" text-anchor="middle">Fluent Bit</text>
    <rect class="chip" x="1030" y="130" width="160" height="44" rx="10"/>
    <text class="chipText" x="1110" y="157" text-anchor="middle">Apps + CloudNativePG</text>
  </g>

  <g class="flow">
    <path class="backups" d="M170 174 V268" marker-end="url(#m-backups)"/>
    <path class="logs" d="M330 174 V288" marker-end="url(#m-logs)"/>
    <path class="metrics" d="M480 174 V288" marker-end="url(#m-metrics)"/>
    <path class="metrics" d="M800 174 V288" marker-end="url(#m-metrics)"/>
    <path class="logs" d="M950 174 V288" marker-end="url(#m-logs)"/>
    <path class="backups" d="M1110 174 V268" marker-end="url(#m-backups)"/>
  </g>
  <text class="edge backupsText" x="178" y="228">restore points</text>
  <text class="edge logsText" x="338" y="228">_bulk</text>
  <text class="edge metricsText" x="488" y="228">remote_write</text>
  <text class="edge metricsText" x="808" y="228">remote_write</text>
  <text class="edge logsText" x="958" y="228">_bulk</text>
  <text class="edge backupsText" x="1118" y="228">restore points</text>

  <g id="vaults">
    <rect class="vault" x="70" y="270" width="200" height="64" rx="12"/>
    <text class="boxText vaultText" x="170" y="296" text-anchor="middle">production-backups</text>
    <text class="boxSub" x="170" y="316" text-anchor="middle">vault · object storage</text>
    <rect class="vault" x="1010" y="270" width="200" height="64" rx="12"/>
    <text class="boxText vaultText" x="1110" y="296" text-anchor="middle">development-backups</text>
    <text class="boxSub" x="1110" y="316" text-anchor="middle">vault · object storage</text>
  </g>

  <g id="hub">
    <rect class="hub" x="290" y="250" width="700" height="440" rx="16"/>
    <text class="cardTitle" x="640" y="274" text-anchor="middle">infrastructure cluster · hub</text>

    <rect class="strip" x="310" y="290" width="660" height="56" rx="10"/>
    <text class="mono" x="322" y="312">/_bulk</text>
    <text class="mono" x="480" y="312" text-anchor="middle">/api/v1/write</text>
    <text class="mono" x="800" y="312" text-anchor="middle">/api/v1/write</text>
    <text class="mono" x="958" y="312" text-anchor="end">/_bulk</text>
    <text class="boxSub" x="640" y="336" text-anchor="middle">Public ingest endpoints · Let's Encrypt TLS · spoke egress addresses only · one exact path each</text>

    <g class="flow">
      <path class="metrics" d="M440 346 V384" marker-end="url(#m-metrics)"/>
      <path class="logs" d="M840 346 V384" marker-end="url(#m-logs)"/>
    </g>

    <rect class="box" x="320" y="386" width="240" height="60" rx="12"/>
    <text class="boxText" x="440" y="411" text-anchor="middle">Prometheus + Alertmanager</text>
    <text class="boxSub" x="440" y="430" text-anchor="middle">every cluster's series</text>

    <rect class="box" x="720" y="386" width="240" height="60" rx="12"/>
    <text class="boxText" x="840" y="411" text-anchor="middle">OpenSearch + Dashboards</text>
    <text class="boxSub" x="840" y="430" text-anchor="middle">one index per cluster per day</text>

    <g class="flow">
      <path class="metrics" d="M420 446 V482" marker-end="url(#m-metrics)"/>
      <path class="metrics" d="M560 520 H534" marker-end="url(#m-metrics)"/>
    </g>

    <rect class="box" x="320" y="486" width="210" height="60" rx="12"/>
    <text class="boxText" x="425" y="511" text-anchor="middle">Grafana</text>
    <text class="boxSub" x="425" y="530" text-anchor="middle">multi-cluster dashboards</text>

    <rect class="box" x="562" y="486" width="130" height="60" rx="12"/>
    <text class="boxText" x="627" y="511" text-anchor="middle">Tempo</text>
    <text class="boxSub" x="627" y="530" text-anchor="middle">traces</text>

    <rect class="box" x="720" y="486" width="110" height="60" rx="12"/>
    <text class="boxText" x="775" y="511" text-anchor="middle">Harbor</text>
    <text class="boxSub" x="775" y="530" text-anchor="middle">registry</text>

    <rect class="box" x="850" y="486" width="110" height="60" rx="12"/>
    <text class="boxText" x="905" y="511" text-anchor="middle">OneUptime</text>
    <text class="boxSub" x="905" y="530" text-anchor="middle">probes, status</text>

    <g class="flow">
      <path class="signin" d="M425 606 V550" marker-end="url(#m-signin)"/>
      <path class="signin" d="M775 606 V550" marker-end="url(#m-signin)"/>
      <path class="signin" d="M905 606 V550" marker-end="url(#m-signin)"/>
      <path class="signin" d="M840 606 V450" marker-end="url(#m-signin)"/>
    </g>

    <rect class="sso" x="310" y="606" width="660" height="64" rx="12"/>
    <text class="boxText" x="640" y="632" text-anchor="middle">Staff sign-in realm · Kratos + Hydra + oauth2-proxy</text>
    <text class="boxSub" x="640" y="652" text-anchor="middle">Microsoft 365, pinned to your tenant · signs people into the four tools above · no local passwords</text>
  </g>

  <g id="alerting">
    <path class="flow alerts" d="M320 416 H258" marker-end="url(#m-alerts)"/>
    <text class="edge alertsText" x="289" y="406" text-anchor="middle">alerts</text>

    <rect class="box" x="70" y="386" width="180" height="60" rx="12"/>
    <text class="boxText" x="160" y="411" text-anchor="middle">on-call channel</text>
    <text class="boxSub" x="160" y="430" text-anchor="middle">Teams or Slack</text>

    <path class="flow alerts" d="M160 486 V452" marker-end="url(#m-alerts)"/>

    <rect class="box" x="70" y="486" width="180" height="60" rx="12"/>
    <text class="boxText" x="160" y="511" text-anchor="middle">Ankra notifications</text>
    <text class="boxSub" x="160" y="530" text-anchor="middle">deploys, sync, agents, CVEs</text>
  </g>

  <g id="legend">
    <text class="lane" x="1010" y="400">FLOWS</text>
    <path class="flow metrics" d="M1010 420 H1040"/><text class="edge" x="1050" y="424">metrics · remote_write</text>
    <path class="flow logs" d="M1010 446 H1040"/><text class="edge" x="1050" y="450">logs · _bulk</text>
    <path class="flow backups" d="M1010 472 H1040"/><text class="edge" x="1050" y="476">restore points · scheduled</text>
    <path class="flow alerts" d="M1010 498 H1040"/><text class="edge" x="1050" y="502">alerts · to one channel</text>
    <path class="flow signin" d="M1010 524 H1040"/><text class="edge" x="1050" y="528">sign-in · staff realm</text>
  </g>

  <text class="lane" x="70" y="724">ORGANISATION-WIDE · VAULTS, ALERT ROUTES AND THE DNS ZONE ARE DECLARED ONCE AND INHERITED BY EVERY CLUSTER</text>
</svg>
