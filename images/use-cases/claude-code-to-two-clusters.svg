<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code writes the code, Ankra generates and runs everything around it, a person promotes to production</title>
  <desc id="desc">Claude Code, with the Ankra skills installed, writes the code and tests and pushes to a GitHub repository. Ankra analyses the repository and writes a setup pull request with the Dockerfile, Kubernetes manifests, the deploy options, the pipeline and a Postgres database when the app needs one, and fixes the pull request itself when its checks fail. Ankra Pipelines tests, builds, scans with Semgrep, Checkov and Trivy, gates and publishes an immutable sha tag in your own cluster. Every pull request gets an Ankra AI review, a preview URL and fix pull requests. Every merge deploys to the development cluster automatically. A person promotes the tag that passed to the production cluster, which runs the same image without a rebuild. On day 2 Ankra watches both clusters: AI review and fix pull requests, alerts, backups, CVEs ranked by known exploitation, Kubernetes upgrades and rollback to a previous tag, and the next change goes back through Claude Code.</desc>
  <style>
