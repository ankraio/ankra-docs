<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Prompt to Production: four sessions, four artefacts</title>
  <desc id="desc">Stage one, Define, produces a plan. Stage two, Storyboard, takes only the plan and produces screens and journeys. Stage three, Orchestrate, takes the storyboard and has sub-agents build it on a fixed stack as pull requests. Stage four, Deploy and verify, brings up development first, tests it in a real browser, and only then promotes the tag that passed to production. Done means evidence: test output, image tag and digest, scan summary, browser recording, public URL and rollback command.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; fill: #64748b; }
    .cardTitle { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12px; fill: #64748b; }
    .chipText { font-size: 12px; font-weight: 600; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .edge { font-size: 11px; font-weight: 500; }
    .bg { fill: #ffffff; }
    .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .last { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
    .badge { fill: #4f46e5; }
    .band { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .bandText { font-size: 13px; font-weight: 500; fill: #3730a3; }
    .flow { fill: none; stroke-width: 2; stroke: #4f46e5; }
    .aText { fill: #4f46e5; } .mkA { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .lane, .sub { fill: #94a3b8; }
      .num { fill: #0f172a; }
      .bg { fill: none; }
      .card { fill: #1e293b; stroke: #475569; }
      .last { fill: #052e16; stroke: #15803d; }
      .chip { fill: #0f172a; stroke: #475569; }
      .badge { fill: #818cf8; }
      .band { fill: #1e1b4b; stroke: #3730a3; }
      .bandText { fill: #c7d2fe; }
      .flow { stroke: #818cf8; }
      .aText, .mkA { fill: #818cf8; }
    }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="440"/>

  <text class="lane" x="40" y="44">ONE SESSION PER STAGE · THE OUTPUT OF A STAGE IS THE ONLY INPUT TO THE NEXT</text>

  <g id="stage1">
    <rect class="card" x="40" y="76" width="240" height="196" rx="14"/>
    <circle class="badge" cx="70" cy="110" r="14"/>
    <text class="num" x="70" y="115" text-anchor="middle">1</text>
    <text class="cardTitle" x="94" y="116">Define</text>
    <text class="sub" x="60" y="152">Research the market and the</text>
    <text class="sub" x="60" y="170">alternatives, then commit to</text>
    <text class="sub" x="60" y="188">a plan and a test contract.</text>
    <rect class="chip" x="60" y="216" width="200" height="34" rx="9"/>
    <text class="chipText" x="160" y="238" text-anchor="middle">docs/plan.md</text>
  </g>

  <g id="stage2">
    <rect class="card" x="360" y="76" width="240" height="196" rx="14"/>
    <circle class="badge" cx="390" cy="110" r="14"/>
    <text class="num" x="390" y="115" text-anchor="middle">2</text>
    <text class="cardTitle" x="414" y="116">Storyboard</text>
    <text class="sub" x="380" y="152">Screens, journeys, empty and</text>
    <text class="sub" x="380" y="170">error states, steered by links</text>
    <text class="sub" x="380" y="188">to products you admire.</text>
    <rect class="chip" x="380" y="216" width="200" height="34" rx="9"/>
    <text class="chipText" x="480" y="238" text-anchor="middle">review page, behind auth</text>
  </g>

  <g id="stage3">
    <rect class="card" x="680" y="76" width="240" height="196" rx="14"/>
    <circle class="badge" cx="710" cy="110" r="14"/>
    <text class="num" x="710" y="115" text-anchor="middle">3</text>
    <text class="cardTitle" x="734" y="116">Orchestrate</text>
    <text class="sub" x="700" y="152">One orchestrator spawns</text>
    <text class="sub" x="700" y="170">sub-agents on a fixed stack,</text>
    <text class="sub" x="700" y="188">one worktree each.</text>
    <rect class="chip" x="700" y="216" width="200" height="34" rx="9"/>
    <text class="chipText" x="800" y="238" text-anchor="middle">pull requests</text>
  </g>

  <g id="stage4">
    <rect class="last" x="1000" y="76" width="240" height="196" rx="14"/>
    <circle class="badge" cx="1030" cy="110" r="14"/>
    <text class="num" x="1030" y="115" text-anchor="middle">4</text>
    <text class="cardTitle" x="1054" y="116">Deploy and verify</text>
    <text class="sub" x="1020" y="152">Development first, tested in</text>
    <text class="sub" x="1020" y="170">a real browser. Production</text>
    <text class="sub" x="1020" y="188">gets the tag that passed.</text>
    <rect class="chip" x="1020" y="216" width="200" height="34" rx="9"/>
    <text class="chipText" x="1120" y="238" text-anchor="middle">verified deployment</text>
  </g>

  <g>
    <path class="flow" d="M280 174 H358" marker-end="url(#m-a)"/>
    <path class="flow" d="M600 174 H678" marker-end="url(#m-a)"/>
    <path class="flow" d="M920 174 H998" marker-end="url(#m-a)"/>
  </g>
  <text class="edge aText" x="319" y="164" text-anchor="middle">plan</text>
  <text class="edge aText" x="639" y="164" text-anchor="middle">design</text>
  <text class="edge aText" x="959" y="164" text-anchor="middle">code</text>

  <rect class="band" x="40" y="304" width="1200" height="56" rx="12"/>
  <text class="bandText" x="640" y="328" text-anchor="middle">Done means evidence</text>
  <text class="sub" x="640" y="348" text-anchor="middle">test output · image tag and digest · scan summary · browser recording · public URL · rollback command</text>

  <text class="lane" x="40" y="404">DEVELOPMENT MAY BE CREATED AND DELETED FREELY · PRODUCTION STAYS OFFLINE UNTIL DEVELOPMENT IS VERIFIED</text>
</svg>
