<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="title desc">
  <title id="title">A shared stack profile puts the whole AI agent observability backend on your own cluster</title>
  <desc id="desc">The vendor shares the moyai-observatory stack profile with your Ankra organisation. You apply it to your cluster with a dry run, bind the secrets and deploy. Ankra deploys and reconciles it on any cluster it manages: Proxmox VE, HPE Morpheus, an imported cluster or a cloud. On the cluster, your AI agents send traces to the API. The API keeps its records in Postgres with three CloudNativePG instances, stores uploads and the Iceberg trace lake in SeaweedFS S3, reads table metadata through the Lakekeeper Iceberg REST catalog, and calls an OpenAI-compatible LLM, which is either the in-cluster CPU demo model, your own vLLM, or a hosted API. A Prometheus from kube-prometheus-stack scrapes every component.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; fill: #64748b; }
    .legend { font-size: 12px; font-weight: 500; fill: #475569; }
    .boxText { font-size: 15px; font-weight: 650; }
    .boxSub { font-size: 12.5px; fill: #64748b; }
    .edge { font-size: 11.5px; font-weight: 600; }
    .badgeText { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .bg { fill: #ffffff; }
    .shadow { fill: #0f172a; opacity: 0.05; }
    .you { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .ankra { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.5; }
    .decide { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; }
    .prod { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 2; }
    .day { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .badgeA { fill: #4f46e5; } .badgeB { fill: #0d9488; } .badgeC { fill: #d97706; }
    .flow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 5 5; }
    .a { stroke: #4f46e5; } .aText { fill: #4f46e5; } .mkA { fill: #4f46e5; }
    .b { stroke: #0d9488; } .bText { fill: #0d9488; } .mkB { fill: #0d9488; }
    .c { stroke: #d97706; } .cText { fill: #d97706; } .mkC { fill: #d97706; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .lane, .boxSub { fill: #94a3b8; }
      .legend { fill: #cbd5e1; }
      .badgeText { fill: #0f172a; }
      .bg { fill: none; }
      .shadow { fill: #000000; opacity: 0.25; }
      .you { fill: #1e1b4b; stroke: #4338ca; }
      .ankra { fill: #042f2e; stroke: #0f766e; }
      .prod { fill: #042f2e; stroke: #2dd4bf; }
      .decide { fill: #3b2f0b; stroke: #b45309; }
      .day { fill: #0f172a; stroke: #334155; }
      .badgeA { fill: #818cf8; } .badgeB { fill: #2dd4bf; } .badgeC { fill: #fbbf24; }
      .a { stroke: #818cf8; } .aText, .mkA { fill: #818cf8; }
      .b { stroke: #2dd4bf; } .bText, .mkB { fill: #2dd4bf; }
      .c { stroke: #fbbf24; } .cText, .mkC { fill: #fbbf24; }
    }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkB" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkC" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="700"/>

  <text class="lane" x="40" y="44">ONE SHARED PROFILE · YOUR CLUSTER · YOUR DATA</text>
  <g id="legend">
    <rect class="decide" x="836" y="32" width="14" height="14" rx="4"/>
    <text class="legend" x="857" y="44">Vendor provides</text>
    <rect class="you" x="980" y="32" width="14" height="14" rx="4"/>
    <text class="legend" x="1001" y="44">You</text>
    <rect class="ankra" x="1060" y="32" width="14" height="14" rx="4"/>
    <text class="legend" x="1081" y="44">Runs on your cluster</text>
  </g>

  <!-- Row 1: share, apply, deploy -->
  <g id="share">
    <rect class="shadow" x="40" y="84" width="340" height="96" rx="16"/>
    <rect class="decide" x="40" y="80" width="340" height="96" rx="16"/>
    <circle class="badgeC" cx="66" cy="106" r="12"/>
    <text class="badgeText" x="66" y="110" text-anchor="middle">1</text>
    <text class="boxText" x="86" y="111">The vendor shares the profile</text>
    <text class="boxSub" x="60" y="142">moyai-observatory, versioned,</text>
    <text class="boxSub" x="60" y="160">with your Ankra organisation</text>
  </g>
  <g id="apply">
    <rect class="shadow" x="470" y="84" width="340" height="96" rx="16"/>
    <rect class="you" x="470" y="80" width="340" height="96" rx="16"/>
    <circle class="badgeA" cx="496" cy="106" r="12"/>
    <text class="badgeText" x="496" y="110" text-anchor="middle">2</text>
    <text class="boxText" x="516" y="111">You apply it</text>
    <text class="boxSub" x="490" y="142">dry run, bind the secrets,</text>
    <text class="boxSub" x="490" y="160">choose the LLM, deploy</text>
  </g>
  <g id="deploy">
    <rect class="shadow" x="900" y="84" width="340" height="96" rx="16"/>
    <rect class="ankra" x="900" y="80" width="340" height="96" rx="16"/>
    <circle class="badgeB" cx="926" cy="106" r="12"/>
    <text class="badgeText" x="926" y="110" text-anchor="middle">3</text>
    <text class="boxText" x="946" y="111">Ankra deploys and reconciles</text>
    <text class="boxSub" x="920" y="142">Proxmox VE, HPE Morpheus,</text>
    <text class="boxSub" x="920" y="160">an imported cluster or any cloud</text>
  </g>
  <path class="flow c" d="M380 128 L462 128" marker-end="url(#m-c)"/>
  <path class="flow a" d="M810 128 L892 128" marker-end="url(#m-a)"/>
  <path class="flow b" d="M1070 176 L1070 212" marker-end="url(#m-b)"/>

  <!-- Row 2: the cluster -->
  <rect class="day" x="280" y="220" width="960" height="450" rx="18"/>
  <text class="lane" x="304" y="250">YOUR CLUSTER</text>

  <g id="agents">
    <rect class="shadow" x="40" y="334" width="200" height="96" rx="16"/>
    <rect class="you" x="40" y="330" width="200" height="96" rx="16"/>
    <text class="boxText" x="60" y="362">Your AI agents</text>
    <text class="boxSub" x="60" y="390">send traces and</text>
    <text class="boxSub" x="60" y="408">read incident reports</text>
  </g>
  <path class="flow a" d="M240 378 L302 378" marker-end="url(#m-a)"/>
  <text class="edge aText" x="246" y="368">traces</text>

  <g id="api">
    <rect class="shadow" x="310" y="304" width="290" height="148" rx="16"/>
    <rect class="prod" x="310" y="300" width="290" height="148" rx="16"/>
    <text class="boxText" x="332" y="334">easterisland API</text>
    <text class="boxSub" x="332" y="364">trace upload and ingest</text>
    <text class="boxSub" x="332" y="384">triage, evidence, incident reports</text>
    <text class="boxSub" x="332" y="404">internal only, or public HTTPS</text>
    <text class="boxSub" x="332" y="424">on a host you choose</text>
  </g>

  <g id="postgres">
    <rect class="shadow" x="700" y="274" width="510" height="72" rx="14"/>
    <rect class="ankra" x="700" y="270" width="510" height="72" rx="14"/>
    <text class="boxText" x="722" y="300">Postgres x3 (CloudNativePG)</text>
    <text class="boxSub" x="722" y="324">one primary, two replicas, automatic failover</text>
  </g>
  <g id="s3">
    <rect class="shadow" x="700" y="364" width="510" height="72" rx="14"/>
    <rect class="ankra" x="700" y="360" width="510" height="72" rx="14"/>
    <text class="boxText" x="722" y="390">SeaweedFS S3</text>
    <text class="boxSub" x="722" y="414">uploaded traces and the Iceberg trace lake</text>
  </g>
  <g id="catalog">
    <rect class="shadow" x="700" y="454" width="510" height="72" rx="14"/>
    <rect class="ankra" x="700" y="450" width="510" height="72" rx="14"/>
    <text class="boxText" x="722" y="480">Iceberg REST catalog (Lakekeeper)</text>
    <text class="boxSub" x="722" y="504">table metadata, on its own Postgres</text>
  </g>
  <g id="llm">
    <rect class="shadow" x="700" y="544" width="510" height="72" rx="14"/>
    <rect class="decide" x="700" y="540" width="510" height="72" rx="14"/>
    <text class="boxText" x="722" y="570">LLM, OpenAI-compatible</text>
    <text class="boxSub" x="722" y="594">in-cluster CPU demo, your own vLLM, or a hosted API</text>
  </g>
  <path class="flow b" d="M600 340 L650 340 L650 306 L692 306" marker-end="url(#m-b)"/>
  <path class="flow b" d="M600 380 L650 380 L650 396 L692 396" marker-end="url(#m-b)"/>
  <path class="flow b" d="M600 412 L640 412 L640 486 L692 486" marker-end="url(#m-b)"/>
  <path class="flow c" d="M600 436 L630 436 L630 576 L692 576" marker-end="url(#m-c)"/>

  <g id="prometheus">
    <rect class="shadow" x="310" y="524" width="290" height="110" rx="16"/>
    <rect class="ankra" x="310" y="520" width="290" height="110" rx="16"/>
    <text class="boxText" x="332" y="552">Prometheus</text>
    <text class="boxSub" x="332" y="580">kube-prometheus-stack, lean</text>
    <text class="boxSub" x="332" y="600">scrapes the API database, S3,</text>
    <text class="boxSub" x="332" y="618">catalog and LLM</text>
  </g>
  <path class="flow b dash" d="M455 520 L455 456" marker-end="url(#m-b)"/>
  <text class="edge bText" x="463" y="494">scrapes</text>
</svg>
