<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Lovable to Ankra in one line: commit, ship, live</title>
  <desc id="desc">An app built in Lovable is synced to your GitHub repository. One Ankra command builds it, scans it, deploys it to your cluster and prints a live HTTPS address. The app keeps talking to its Supabase project, and every later edit in Lovable is rebuilt and redeployed.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; fill: #64748b; }
    .boxText { font-size: 15px; font-weight: 600; }
    .boxSub { font-size: 12px; fill: #64748b; }
    .edge { font-size: 12px; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #3730a3; }
    .bg { fill: #ffffff; }
    .src { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .ankra { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .live { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; }
    .db { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; }
    .flow { fill: none; stroke-width: 2; }
    .a { stroke: #4f46e5; } .aText { fill: #4f46e5; } .mkA { fill: #4f46e5; }
    .c { stroke: #d97706; } .mkC { fill: #d97706; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .lane, .boxSub { fill: #94a3b8; }
      .mono { fill: #c7d2fe; }
      .bg { fill: none; }
      .src { fill: #1e293b; stroke: #475569; }
      .ankra { fill: #1e1b4b; stroke: #3730a3; }
      .live { fill: #052e16; stroke: #15803d; }
      .db { fill: #3b2f0b; stroke: #a16207; }
      .a { stroke: #818cf8; } .aText, .mkA { fill: #818cf8; }
      .c { stroke: #fbbf24; } .mkC { fill: #fbbf24; }
    }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkC" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="300"/>
  <text class="lane" x="40" y="44">YOU KEEP PROMPTING · ANKRA DOES THE REST</text>

  <rect class="src" x="40" y="84" width="220" height="92" rx="14"/>
  <text class="boxText" x="150" y="122" text-anchor="middle">Lovable</text>
  <text class="boxSub" x="150" y="146" text-anchor="middle">prompt and edit</text>

  <rect class="src" x="330" y="84" width="220" height="92" rx="14"/>
  <text class="boxText" x="440" y="122" text-anchor="middle">GitHub</text>
  <text class="boxSub" x="440" y="146" text-anchor="middle">your repository</text>

  <rect class="ankra" x="620" y="68" width="320" height="124" rx="14"/>
  <text class="boxText" x="780" y="106" text-anchor="middle">Ankra</text>
  <text class="mono" x="780" y="134" text-anchor="middle">ankra application ship .</text>
  <text class="boxSub" x="780" y="160" text-anchor="middle">build · scan · deploy · TLS</text>

  <rect class="live" x="1010" y="84" width="230" height="92" rx="14"/>
  <text class="boxText" x="1125" y="122" text-anchor="middle">Live on your cluster</text>
  <text class="boxSub" x="1125" y="146" text-anchor="middle">https address printed</text>

  <g class="flow">
    <path class="a" d="M260 130 H328" marker-end="url(#m-a)"/>
    <path class="a" d="M550 130 H618" marker-end="url(#m-a)"/>
    <path class="a" d="M940 130 H1008" marker-end="url(#m-a)"/>
  </g>
  <text class="edge aText" x="294" y="116" text-anchor="middle">sync</text>
  <text class="edge aText" x="584" y="116" text-anchor="middle">push</text>
  <text class="edge aText" x="974" y="116" text-anchor="middle">ship</text>

  <path class="flow c" d="M1125 176 V232" marker-end="url(#m-c)"/>
  <rect class="db" x="1010" y="234" width="230" height="46" rx="12"/>
  <text class="boxText" x="1125" y="263" text-anchor="middle">Supabase, unchanged</text>

  <text class="boxSub" x="40" y="236">Every later edit in Lovable is a commit,</text>
  <text class="boxSub" x="40" y="256">and Ankra rebuilds and redeploys it.</text>
</svg>
