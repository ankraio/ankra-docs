<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Lovable to your own cluster: the wizard, then Ankra runs the app and an open-source backend</title>
  <desc id="desc">An app built in Lovable is synced to your GitHub repository. Ankra's add-application wizard and AI analyse it and open a setup pull request. Ankra builds, scans and deploys it to your cluster, where it runs next to open-source Postgres and object storage that Ankra also runs. A live HTTPS address is printed, and every later edit in Lovable is rebuilt and redeployed.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; fill: #64748b; }
    .boxText { font-size: 15px; font-weight: 600; }
    .boxSub { font-size: 12px; fill: #64748b; }
    .edge { font-size: 12px; font-weight: 600; }
    .chipText { font-size: 12px; font-weight: 600; }
    .bg { fill: #ffffff; }
    .src { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .ankra { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .cluster { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #bbf7d0; stroke-width: 1.25; }
    .flow { fill: none; stroke-width: 2; }
    .a { stroke: #4f46e5; } .aText { fill: #4f46e5; } .mkA { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .lane, .boxSub { fill: #94a3b8; }
      .bg { fill: none; }
      .src { fill: #1e293b; stroke: #475569; }
      .ankra { fill: #1e1b4b; stroke: #3730a3; }
      .cluster { fill: #052e16; stroke: #15803d; }
      .chip { fill: #0f172a; stroke: #15803d; }
      .a { stroke: #818cf8; } .aText, .mkA { fill: #818cf8; }
    }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="340"/>
  <text class="lane" x="40" y="44">YOU KEEP PROMPTING · ANKRA RUNS EVERYTHING ELSE ON YOUR CLUSTER</text>

  <rect class="src" x="40" y="96" width="190" height="92" rx="14"/>
  <text class="boxText" x="135" y="134" text-anchor="middle">Lovable</text>
  <text class="boxSub" x="135" y="158" text-anchor="middle">prompt and edit</text>

  <rect class="src" x="280" y="96" width="190" height="92" rx="14"/>
  <text class="boxText" x="375" y="134" text-anchor="middle">GitHub</text>
  <text class="boxSub" x="375" y="158" text-anchor="middle">your repository</text>

  <rect class="ankra" x="520" y="80" width="250" height="124" rx="14"/>
  <text class="boxText" x="645" y="116" text-anchor="middle">Ankra wizard and AI</text>
  <text class="boxSub" x="645" y="140" text-anchor="middle">reads the repo, opens the</text>
  <text class="boxSub" x="645" y="160" text-anchor="middle">setup pull request, builds,</text>
  <text class="boxSub" x="645" y="180" text-anchor="middle">scans and deploys</text>

  <rect class="cluster" x="820" y="64" width="420" height="220" rx="14"/>
  <text class="boxText" x="1030" y="94" text-anchor="middle">Your Kubernetes cluster</text>
  <rect class="chip" x="844" y="116" width="372" height="40" rx="10"/>
  <text class="chipText" x="1030" y="141" text-anchor="middle">Your app · HTTPS address printed</text>
  <rect class="chip" x="844" y="170" width="176" height="40" rx="10"/>
  <text class="chipText" x="932" y="195" text-anchor="middle">PostgreSQL</text>
  <rect class="chip" x="1040" y="170" width="176" height="40" rx="10"/>
  <text class="chipText" x="1128" y="195" text-anchor="middle">S3 storage</text>
  <rect class="chip" x="844" y="224" width="176" height="40" rx="10"/>
  <text class="chipText" x="932" y="249" text-anchor="middle">Valkey cache</text>
  <rect class="chip" x="1040" y="224" width="176" height="40" rx="10"/>
  <text class="chipText" x="1128" y="249" text-anchor="middle">Sign-in provider</text>

  <g class="flow">
    <path class="a" d="M230 142 H278" marker-end="url(#m-a)"/>
    <path class="a" d="M470 142 H518" marker-end="url(#m-a)"/>
    <path class="a" d="M770 142 H818" marker-end="url(#m-a)"/>
  </g>
  <text class="edge aText" x="254" y="126" text-anchor="middle">sync</text>
  <text class="edge aText" x="494" y="126" text-anchor="middle">push</text>
  <text class="edge aText" x="794" y="126" text-anchor="middle">deploy</text>

  <text class="boxSub" x="40" y="250">Every later edit in Lovable is a commit,</text>
  <text class="boxSub" x="40" y="270">and Ankra rebuilds and redeploys it.</text>
  <text class="lane" x="40" y="318">OPEN SOURCE, ON INFRASTRUCTURE YOU CONTROL</text>
</svg>
