<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Lovable commits to GitHub, Ankra builds and tests, development proves it, production runs the same image</title>
  <desc id="desc">An app built in Lovable is committed to your GitHub repository. An Ankra pipeline tests, builds, scans and gates it and publishes an immutable tag. The tag is deployed to a development cluster and proved there, then promoted unchanged to a production cluster. Each environment talks to its own Supabase project, and one image serves both because the backend address is injected when the container starts.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; fill: #64748b; }
    .boxText { font-size: 14px; font-weight: 600; }
    .boxSub { font-size: 12px; fill: #64748b; }
    .edge { font-size: 11px; font-weight: 500; }
    .note { font-size: 12px; fill: #64748b; }
    .bg { fill: #ffffff; }
    .src { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .pipe { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    .dev { fill: #ecfeff; stroke: #a5f3fc; stroke-width: 1.5; }
    .prod { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; }
    .db { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; }
    .flow { fill: none; stroke-width: 2; }
    .a { stroke: #4f46e5; } .aText { fill: #4f46e5; } .mkA { fill: #4f46e5; }
    .b { stroke: #0d9488; } .bText { fill: #0d9488; } .mkB { fill: #0d9488; }
    .c { stroke: #d97706; } .cText { fill: #d97706; } .mkC { fill: #d97706; }
    .rule { stroke: #cbd5e1; stroke-width: 1.25; stroke-dasharray: 4 4; fill: none; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f5f9; }
      .lane, .boxSub, .note { fill: #94a3b8; }
      .bg { fill: none; }
      .src { fill: #1e293b; stroke: #475569; }
      .pipe { fill: #1e1b4b; stroke: #3730a3; }
      .dev { fill: #083344; stroke: #0e7490; }
      .prod { fill: #052e16; stroke: #15803d; }
      .db { fill: #3b2f0b; stroke: #a16207; }
      .a { stroke: #818cf8; } .aText, .mkA { fill: #818cf8; }
      .b { stroke: #2dd4bf; } .bText, .mkB { fill: #2dd4bf; }
      .c { stroke: #fbbf24; } .cText, .mkC { fill: #fbbf24; }
      .rule { stroke: #475569; }
    }
  </style>
  <defs>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkA" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkB" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkC" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="bg" width="1280" height="460"/>

  <text class="lane" x="40" y="44">YOU PROMPT · ANKRA RUNS</text>

  <g id="lovable">
    <rect class="src" x="40" y="130" width="190" height="84" rx="14"/>
    <text class="boxText" x="135" y="164" text-anchor="middle">Lovable</text>
    <text class="boxSub" x="135" y="186" text-anchor="middle">prompt and edit</text>
  </g>
  <g id="github">
    <rect class="src" x="280" y="130" width="190" height="84" rx="14"/>
    <text class="boxText" x="375" y="164" text-anchor="middle">GitHub</text>
    <text class="boxSub" x="375" y="186" text-anchor="middle">your repository</text>
  </g>
  <g id="pipeline">
    <rect class="pipe" x="520" y="116" width="250" height="112" rx="14"/>
    <text class="boxText" x="645" y="152" text-anchor="middle">Ankra pipeline</text>
    <text class="boxSub" x="645" y="176" text-anchor="middle">test · build · scan · gate</text>
    <text class="boxSub" x="645" y="196" text-anchor="middle">publishes an immutable tag</text>
  </g>
  <g id="development">
    <rect class="dev" x="820" y="130" width="190" height="84" rx="14"/>
    <text class="boxText" x="915" y="164" text-anchor="middle">Development</text>
    <text class="boxSub" x="915" y="186" text-anchor="middle">.dev · proved first</text>
  </g>
  <g id="production">
    <rect class="prod" x="1060" y="130" width="180" height="84" rx="14"/>
    <text class="boxText" x="1150" y="164" text-anchor="middle">Production</text>
    <text class="boxSub" x="1150" y="186" text-anchor="middle">.com · promoted tag</text>
  </g>

  <g class="flow">
    <path class="a" d="M230 172 H278" marker-end="url(#m-a)"/>
    <path class="a" d="M470 172 H518" marker-end="url(#m-a)"/>
    <path class="a" d="M770 172 H818" marker-end="url(#m-a)"/>
    <path class="b" d="M1010 172 H1058" marker-end="url(#m-b)"/>
  </g>
  <text class="edge aText" x="254" y="156" text-anchor="middle">sync</text>
  <text class="edge aText" x="494" y="156" text-anchor="middle">push</text>
  <text class="edge aText" x="794" y="156" text-anchor="middle">tag</text>
  <text class="edge bText" x="1034" y="156" text-anchor="middle">same tag</text>

  <g id="backends">
    <path class="flow c" d="M915 214 V292" marker-end="url(#m-c)"/>
    <path class="flow c" d="M1150 214 V292" marker-end="url(#m-c)"/>
    <rect class="db" x="820" y="294" width="190" height="72" rx="14"/>
    <text class="boxText" x="915" y="326" text-anchor="middle">Supabase dev</text>
    <text class="boxSub" x="915" y="348" text-anchor="middle">own project, own keys</text>
    <rect class="db" x="1060" y="294" width="180" height="72" rx="14"/>
    <text class="boxText" x="1150" y="326" text-anchor="middle">Supabase prod</text>
    <text class="boxSub" x="1150" y="348" text-anchor="middle">own project, own keys</text>
  </g>

  <path class="rule" d="M820 392 H1240"/>
  <text class="note" x="1030" y="414" text-anchor="middle">One image for both: the backend address is injected when the container starts</text>

  <text class="note" x="40" y="270">Every edit in Lovable is a commit,</text>
  <text class="note" x="40" y="290">and every commit is a build on Ankra.</text>

  <text class="lane" x="40" y="436">PRODUCTION NEVER FOLLOWS A PUSH · IT RECEIVES THE TAG THAT PASSED DEVELOPMENT</text>
</svg>
