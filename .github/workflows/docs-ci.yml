name: Docs CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  structure:
    name: Structure checks
    runs-on: ${{ vars.CI_RUNNER_2 || 'depot-ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: pip install pyyaml

      - name: Navigation covers every page
        run: python3 scripts/check_nav.py

      - name: Frontmatter complete
        run: python3 scripts/check_frontmatter.py

      - name: Snippets free of corruption
        run: python3 scripts/check_snippets.py

      # routes.json is the cluster repo's route census (every route the real
      # chi router registers; ankraio/cluster docs/route-census.md). It is the
      # truth for every /api/v1 and /org path a writer states by hand.
      # CLUSTER_ROUTES_GITHUB_TOKEN is a fine-grained PAT with read-only
      # contents access to ankraio/cluster (the PAT portal keeps as
      # CLUSTER_OPENAPI_GITHUB_TOKEN). An unset or rejected token fails here,
      # on purpose: a check that passes without its input is no check.
      - name: Fetch cluster routes.json
        env:
          CLUSTER_REPO: ankraio/cluster
          CLUSTER_ROUTES_REF: main
        run: |
          if [ -z "${{ secrets.CLUSTER_ROUTES_GITHUB_TOKEN }}" ]; then
            echo "::error::CLUSTER_ROUTES_GITHUB_TOKEN is unset - add the repo secret (fine-grained PAT, contents:read on ankraio/cluster, the same PAT portal uses as CLUSTER_OPENAPI_GITHUB_TOKEN). Not a docs drift."
            exit 1
          fi
          http_status=$(curl --silent --show-error \
            --header "Authorization: Bearer ${{ secrets.CLUSTER_ROUTES_GITHUB_TOKEN }}" \
            --header "Accept: application/vnd.github.raw+json" \
            --write-out "%{http_code}" \
            "https://api.github.com/repos/${CLUSTER_REPO}/contents/routes.json?ref=${CLUSTER_ROUTES_REF}" \
            -o routes.json)
          if [ "$http_status" != "200" ]; then
            echo "::error::Fetching cluster routes.json failed with HTTP $http_status (401/403: the PAT expired or lost contents:read; 404: the census moved from the cluster repo root)"
            exit 1
          fi

      - name: Documented API paths exist on the cluster router
        run: python3 scripts/check_api_paths.py --self-test && python3 scripts/check_api_paths.py

      - name: Live OpenAPI spec reachable
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://platform.ankra.app/openapi.json)
          if [ "$status" != "200" ]; then
            echo "OpenAPI spec at platform.ankra.app returned HTTP $status"
            exit 1
          fi
          paths=$(curl -s https://platform.ankra.app/openapi.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["paths"]))')
          echo "Live spec OK ($paths paths)"

  links:
    name: Broken links
    runs-on: ${{ vars.CI_RUNNER_2 || 'depot-ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check broken links
        run: pnpm exec mint broken-links

  prose:
    name: Prose lint (warnings)
    runs-on: ${{ vars.CI_RUNNER_2 || 'depot-ubuntu-24.04' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: errata-ai/vale-action@v2
        with:
          fail_on_error: false
          filter_mode: added
