name: Build and Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: registry.ankra.cloud
  IMAGE_NAME: org-3b7dccca-0788-4470-9910-19478ae345ae/ankra-docs

jobs:
  build-and-push:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config "p/default" --config "p/javascript" --config "p/docker" --config "p/github-actions" --json --output semgrep-results.json || true
        continue-on-error: true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('semgrep-results.json') != ''
        with:
          name: ankra-semgrep-scan
          path: semgrep-results.json
          retention-days: 90

      - name: Run Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          output_format: json
          output_file_path: checkov-results.json
          soft_fail: true
          framework: dockerfile,helm,github_actions
        continue-on-error: true

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('checkov-results.json') != ''
        with:
          name: ankra-checkov-scan
          path: checkov-results.json
          retention-days: 90

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Ankra registry
        uses: docker/login-action@v3
        with:
          registry: registry.ankra.cloud
          username: ${{ secrets.ANKRA_REGISTRY_USERNAME }}
          password: ${{ secrets.ANKRA_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.ankra.cloud/org-3b7dccca-0788-4470-9910-19478ae345ae/ankra-docs
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        env:
          TRIVY_USERNAME: ${{ secrets.ANKRA_REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.ANKRA_REGISTRY_PASSWORD }}
        with:
          image-ref: registry.ankra.cloud/org-3b7dccca-0788-4470-9910-19478ae345ae/ankra-docs:sha-${{ steps.vars.outputs.short_sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-results.json') != ''
        with:
          name: ankra-security-scan
          path: trivy-results.json
          retention-days: 90
